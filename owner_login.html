<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>👑 IGTGWP MASTER | Platform Owner Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070209;
      --card-bg: rgba(20, 8, 28, 0.85);
      --gold: #facc15;
      --gold-glow: rgba(250, 204, 21, 0.45);
      --primary: #ff0055;
      --text-main: #ffffff;
      --text-muted: #a1a1aa;
      --input-bg: rgba(10, 3, 15, 0.9);
      --input-border: rgba(250, 204, 21, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(250, 204, 21, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(255, 0, 85, 0.1) 0%, transparent 40%),
        linear-gradient(135deg, #07010a 0%, #160722 50%, #08010d 100%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .owner-card {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid rgba(250, 204, 21, 0.35);
      backdrop-filter: blur(24px);
      border-radius: 24px;
      padding: 40px 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 35px rgba(250, 204, 21, 0.15);
      position: relative;
      overflow: hidden;
      text-align: center;
    }

    .owner-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #ff0055, #facc15, #ff0055);
    }

    .badge-owner {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      background: rgba(250, 204, 21, 0.12);
      color: var(--gold);
      border: 1px solid rgba(250, 204, 21, 0.35);
      margin-bottom: 16px;
    }

    .owner-title {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
      text-shadow: 0 0 15px rgba(250, 204, 21, 0.4);
    }

    .owner-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 6px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .form-input {
      width: 100%;
      padding: 13px 16px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 14px rgba(250, 204, 21, 0.3);
    }

    .btn-owner {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #facc15 0%, #ca8a04 100%);
      color: #000000;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 8px 25px rgba(250, 204, 21, 0.3);
      margin-top: 8px;
    }

    .btn-owner:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(250, 204, 21, 0.5);
      background: linear-gradient(135deg, #fde047 0%, #d97706 100%);
    }

    .btn-owner:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .alert {
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      margin-bottom: 18px;
      display: none;
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
    }

    .alert-success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #10b981;
      color: #86efac;
    }

    .footer-link {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 13px;
      color: var(--text-muted);
    }

    .footer-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
    }

    .footer-link a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      body {
        padding: 14px;
        align-items: flex-start;
      }
      .owner-card {
        padding: 26px 18px;
        border-radius: 20px;
        margin-top: 10px;
      }
      .owner-title {
        font-size: 20px;
      }
      .form-input {
        font-size: 16px;
        padding: 13px 14px;
      }
      .btn-owner {
        padding: 14px 18px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <div class="owner-card">
    <div class="badge-owner">👑 HIGHEST PRIVILEGE ACCESS</div>
    <h1 class="owner-title">OWNER COMMAND CENTER</h1>
    <p class="owner-sub">LOST GOD Master Control</p>

    <div id="ownerAlert" class="alert"></div>

    <form id="ownerForm" onsubmit="handleOwnerLogin(event)">
      <div class="form-group">
        <label class="form-label">Owner Username</label>
        <input type="text" id="ownerUser" class="form-input" placeholder="Enter Owner Username..." required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label">Master Passcode</label>
        <input type="password" id="ownerPass" class="form-input" placeholder="Enter Master Passcode..." required>
      </div>

      <button type="submit" id="ownerBtn" class="btn-owner">
        ⚡ UNLOCK OWNER DASHBOARD
      </button>
    </form>

    <div class="footer-link">
      <p>Standard User Account? <a href="/login">👤 Go to User Portal</a></p>
    </div>
  </div>

  <script>
    async function handleOwnerLogin(e) {
      e.preventDefault();
      const alertBox = document.getElementById("ownerAlert");
      alertBox.style.display = "none";

      const username = document.getElementById("ownerUser").value.trim();
      const ownerpass = document.getElementById("ownerPass").value.trim();
      const btn = document.getElementById("ownerBtn");

      btn.disabled = true;
      btn.textContent = "Authenticating Master Key...";

      try {
        const res = await fetch("/api/owner/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, ownerpass, password: ownerpass })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          alertBox.className = "alert alert-success";
          alertBox.textContent = data.message || "👑 Owner Access Granted! Redirecting...";
          alertBox.style.display = "block";
          setTimeout(() => { window.location.href = "/mode"; }, 800);
        } else {
          alertBox.className = "alert alert-error";
          alertBox.textContent = data.message || "❌ Invalid Owner Credentials!";
          alertBox.style.display = "block";
          btn.disabled = false;
          btn.textContent = "⚡ UNLOCK OWNER DASHBOARD";
        }
      } catch (err) {
        alertBox.className = "alert alert-error";
        alertBox.textContent = "Connection error: " + err.message;
        alertBox.style.display = "block";
        btn.disabled = false;
        btn.textContent = "⚡ UNLOCK OWNER DASHBOARD";
      }
    }
  </script>
</body>
</html>
