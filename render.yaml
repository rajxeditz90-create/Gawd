# Render Blueprint for the Telegram Master Engine
# Deploy with: Render Dashboard -> New -> Blueprint -> point at this repo.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: telegram-master-engine
    runtime: docker
    dockerfilePath: ./Dockerfile
    # 'starter' keeps the service always-on. On the free plan a web service
    # spins down after ~15 min without traffic, which stops the bot.
    plan: starter
    region: singapore          # closest to India; change if you prefer
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Render injects PORT automatically for web services - do NOT set it here.
      - key: TELEGRAM_API_ID
        sync: false            # set the real value in the dashboard
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_PHONE
        sync: false
      - key: MASTER_ADMIN_ID
        sync: false
      - key: MONGODB_URI
        sync: false            # MongoDB Atlas connection string (keeps sessions across restarts)
      - key: SESSION_STORAGE
        value: mongodb         # 'mongodb' so sessions survive Render's ephemeral disk
      # ---- Web panel (user login + owner portal) ----
      - key: OWNER_USERNAME
        value: owner
      - key: OWNER_PASSCODE
        sync: false            # the owner portal's master passcode
      # ---- Outgoing email for OTPs (Gmail app password, Brevo, Mailgun, etc.) ----
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_SSL
        value: "false"         # "true" for port 465 / implicit TLS
